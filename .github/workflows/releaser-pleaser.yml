name: releaser-pleaser

# Maintains a release pull request with the next version and changelog.
# Merging it creates the tag and GitHub release, which triggers the release workflow.
on:
  push:
    branches: [main]
  pull_request_target:
    types:
      - edited
      - labeled
      - unlabeled

permissions: {}

jobs:
  releaser-pleaser:
    name: releaser-pleaser
    # Only the release pull request and merged pull requests (rp-commits overrides) affect the release.
    # Edits of other open pull requests (e.g. by Renovate) are skipped and do not cancel a running job.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.merged ||
      github.event.pull_request.head.ref == 'releaser-pleaser--branches--main'
    # On job level, so that skipped runs do not join the group.
    concurrency:
      group: releaser-pleaser
      cancel-in-progress: true
    runs-on: ubuntu-26.04
    steps:
      - name: releaser-pleaser
        uses: apricote/releaser-pleaser@93a3e2c401320206dcd9a9b7a5bbc0850072b3c6 # v0.9.0
        with:
          # A personal access token is required, because tags created with the GITHUB_TOKEN do not trigger
          # the release workflow and checks would not run on the release pull request.
          token: ${{ secrets.RELEASER_PLEASER_TOKEN }}
          updaters: packagejson
