name: Release

on:
  push:
    branches:
      - main
      - next

# Never cancel a running release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  # The full test matrix already ran in the pull request, so only test once before releasing.
  release:
    name: Release
    runs-on: ubuntu-26.04
    permissions:
      # required for npm trusted publishing with OIDC.
      # https://docs.npmjs.com/trusted-publishers#step-2-configure-your-cicd-workflow
      # https://github.com/semantic-release/npm?tab=readme-ov-file#trusted-publishing-from-github-actions
      contents: write # to be able to publish a GitHub release
      issues: write # to be able to comment on released issues
      pull-requests: write # to be able to comment on released pull requests
      id-token: write # to enable use of OIDC for trusted publishing and npm provenance
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Verify the integrity of provenance attestations and registry signatures for installed dependencies
        run: npm audit signatures

      - name: Test
        run: pnpm test:ci

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release

      # semantic-release creates the tag of a new release on the current commit.
      - name: Get release tag
        id: tag
        run: echo "tag=$(git tag --points-at HEAD 'v*' | head -n 1)" >> "$GITHUB_OUTPUT"

  publish-jsr:
    name: JSR
    needs: release
    if: needs.release.outputs.tag != ''
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-jsr.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
