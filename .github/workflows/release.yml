name: Release

on:
  push:
    tags:
      - "v*.*.*"

# Never cancel a running release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  # The full test matrix already ran in the release pull request, so only test once before publishing.
  release:
    name: Release
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      # required for npm trusted publishing with OIDC and npm provenance.
      # https://docs.npmjs.com/trusted-publishers
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          cache: pnpm

      - name: Verify that the tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package.json version $VERSION"
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify the integrity of provenance attestations and registry signatures for installed dependencies
        run: npm audit signatures

      - name: Test
        run: pnpm test:ci

      # npm publish runs the prepack script, which builds the package.
      - name: Publish to npm
        run: npm publish --provenance

  publish-jsr:
    name: JSR
    needs: release
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-jsr.yml
    with:
      tag: ${{ github.ref_name }}
