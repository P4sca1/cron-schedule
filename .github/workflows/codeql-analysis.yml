name: "CodeQL"

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - LICENSE
      - .vscode/**
  # Also analyzes the default branch regularly. Pushes to main are not analyzed, because every change is
  # already analyzed in its pull request.
  schedule:
    - cron: "36 14 * * 3"

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      security-events: write # to upload the results

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # JavaScript and TypeScript do not need to be built for the analysis.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
